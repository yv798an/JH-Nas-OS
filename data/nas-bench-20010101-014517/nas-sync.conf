# nas-server 运行配置（由 Buildroot overlay 注入）
# 格式：每行 key = value；# 起注释；未知键会导致启动失败。
# 优先级：命令行 > 本文件 > 内置默认。

# ---- HTTP 服务 ----
http.host = 0.0.0.0
http.port = 8080

# ---- 共享目录白名单 ----
# 镜像的 USB 挂载点为 /media/sdaX；用 /media 让所有真实挂载点都出现在
# share 列表（ShareRegistry 只把 allowedRoots 的严格子路径视为 share，
# 因此这里不能填 /media/sda1 本身，否则 share 列表为空）。
# Samba 目前固定 sda1/sda2；如需完全一致，改 smb.conf 或再加 sdb1。
share.roots = /media

# ---- 日志 ----
# 根文件系统可写，使用标准路径；如需掉电/重刷镜像后保留日志，
# 改为 /mnt/data/nas/log/nas-server.log 并在 S92nasweb 里创建目录。
log.file = /var/log/nas-server.log
log.level = INFO

# ---- 网页 UI ----
# 留空 = 使用编译进二进制的内嵌 UI。
web.dir =

# ---- 下载 I/O ----
# 需镜像启用 liburing；运行期 ring 初始化失败会自动回退同步读。
io.uring = false
io.blockKb = 128
io.depth = 8
io.thresholdKb = 4096

# ---- 系统状态轮询 ----
monitor.pollMs = 1000
